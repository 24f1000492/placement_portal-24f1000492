{% extends 'layout_dashboard.html' %}
{% block title %}Edit Drive{% endblock %}
{% block sidebar %}
  <div class="sidebar-section">Overview</div>
  <a href="{{ url_for('company_dashboard') }}" class="sidebar-link"><i class="bi bi-grid-fill"></i> Dashboard</a>
  <div class="sidebar-section">Recruitment</div>
  <a href="{{ url_for('company_drives') }}" class="sidebar-link active"><i class="bi bi-briefcase"></i> My Drives</a>
  <a href="{{ url_for('company_create_drive') }}" class="sidebar-link"><i class="bi bi-plus-circle"></i> Create Drive</a>
  <div class="sidebar-section">Account</div>
  <a href="{{ url_for('company_edit_profile') }}" class="sidebar-link"><i class="bi bi-building-gear"></i> Edit Profile</a>
{% endblock %}
{% block content %}
<div class="page-header"><h1>✏️ Edit Drive</h1><p>Changes will require re-approval from admin</p></div>
<div style="max-width:640px;">
<div class="card"><div class="card-body">
<form method="POST" action="{{ url_for('company_edit_drive', drive_id=drive.id) }}">
  <div class="mb-3"><label class="form-label">Job Title *</label><input type="text" name="job_title" class="form-control" value="{{ drive.job_title }}" required></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:.75rem;">
    <div class="mb-3"><label class="form-label">Salary / Package</label><input type="text" name="salary_package" class="form-control" value="{{ drive.salary_package or '' }}"></div>
    <div class="mb-3"><label class="form-label">Location</label><input type="text" name="location" class="form-control" value="{{ drive.location or '' }}"></div>
  </div>
  <div class="mb-3"><label class="form-label">Application Deadline *</label><input type="date" name="application_deadline" class="form-control" value="{{ drive.application_deadline.strftime('%Y-%m-%d') }}" required></div>
  <div class="mb-3"><label class="form-label">Job Description *</label><textarea name="job_description" class="form-control" rows="5" required>{{ drive.job_description }}</textarea></div>
  <div class="mb-4"><label class="form-label">Eligibility Criteria</label><textarea name="eligibility_criteria" class="form-control" rows="3">{{ drive.eligibility_criteria or '' }}</textarea></div>
  <div style="display:flex;gap:.5rem;">
    <button type="submit" class="btn btn-primary px-4">💾 Update Drive</button>
    <a href="{{ url_for('company_drives') }}" class="btn btn-outline-secondary px-4">Cancel</a>
  </div>
</form>
</div></div></div>
{% endblock %}
